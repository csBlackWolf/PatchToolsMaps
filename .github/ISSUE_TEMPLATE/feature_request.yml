name: Feature idea / Funktionswunsch
description: Share an idea for PatchToolsMaps. Deutsch und Englisch sind willkommen.
title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make PatchToolsMaps more useful? Tell us about it below.
        No technical knowledge needed. English and German are both welcome.

        Eine Idee für PatchToolsMaps? Beschreibe sie einfach unten.
        Technisches Wissen ist nicht nötig. Deutsch und Englisch sind willkommen.
  - type: textarea
    id: idea
    attributes:
      label: Your idea / Deine Idee
      description: What would you like PatchToolsMaps to do? / Was soll PatchToolsMaps können?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help? / Wobei würde es helfen?
      description: Optional. A short example is enough. / Optional. Ein kurzes Beispiel genügt.
    validations:
      required: false
  - type: input
    id: game
    attributes:
      label: WoW version / WoW-Version
      description: Optional, for example Forever. / Optional, zum Beispiel Forever.
    validations:
      required: false
