name: Project status, labels and assignees
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: project-status-labels
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check synchronization logic
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Mirror board status and claim reviewed issues
        env:
          PROJECT_READ_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/sync_project_status.py
